name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * *'   # ежедневный smoke-тест источников
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Ruff check
        run: ruff check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Mypy
        run: mypy apps packages

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: postupi_test
          POSTGRES_USER: postupi
          POSTGRES_PASSWORD: postupi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postupi -d postupi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTUPI_TEST_DATABASE_URL: postgresql+asyncpg://postupi:postupi@localhost:5432/postupi_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Migrate
        run: alembic upgrade head
        env:
          POSTUPI_DATABASE_URL: postgresql+asyncpg://postupi:postupi@localhost:5432/postupi_test
      - name: Pytest
        run: pytest -q
        env:
          POSTUPI_DATABASE_URL: postgresql+asyncpg://postupi:postupi@localhost:5432/postupi_test

  smoke-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Smoke sources
        run: python -m apps.tools.smoke_sources
